<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ReviewDrop</title><style>body{margin:0;font-family:Inter,system-ui;background:#07111f;color:#f5f9ff}main{max-width:900px;margin:auto;padding:70px 20px}.tag{font-size:11px;letter-spacing:.15em;color:#6ad9ba;font-weight:900}.card{margin-top:30px;padding:28px;border:1px solid #ffffff12;background:#0d1a2c;border-radius:22px}.stars{color:#ffd45c;letter-spacing:.2em}textarea,input{display:block;width:100%;box-sizing:border-box;padding:13px;border-radius:12px;border:1px solid #ffffff12;background:#091523;color:white;font:inherit;margin-top:7px}.btn{margin-top:12px;padding:13px 17px;border:0;border-radius:12px;background:#6ad9ba;color:#06101d;font-weight:900}.quote{font-size:25px;line-height:1.35}.muted{color:#98aabc}@media(max-width:600px){.quote{font-size:20px}}</style></head><body><main><span class="tag">REVIEWDROP</span><h1>Collect words your next buyer can trust.</h1><p class="muted">A focused testimonial intake page. The paid version can host branded widgets, moderation and automated review requests.</p><section class="card"><div class="stars">★★★★★</div><p class="quote">“The fastest way to turn a happy client into proof for the next sale.”</p><div class="field"><label>Name<input id="name" placeholder="Client name"></label></div><div class="field"><label>Testimonial<textarea id="text" rows="4" placeholder="What changed after working with us?"></textarea></label></div><button class="btn" onclick="send()">Save testimonial</button><p id="msg" class="muted"></p></section></main><script>function send(){const n=document.querySelector('#name').value.trim();const t=document.querySelector('#text').value.trim();document.querySelector('#msg').textContent=n&&t?'Demo saved locally — next step would be moderation and publishing.':'Add a name and testimonial first.'}</script></body></html>
