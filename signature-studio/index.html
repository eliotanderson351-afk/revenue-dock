<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signature Studio</title><style>
:root{--bg:#08111f;--panel:#101c2c;--line:#263a58;--text:#eff6ff;--muted:#9bb0c8;--accent:#68a9ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#16365d,#08111f 45%);color:var(--text);font-family:Inter,system-ui,sans-serif}main{max-width:1140px;margin:auto;padding:40px 20px 70px}.eyebrow{font-size:12px;color:#8fbfff;letter-spacing:.14em;text-transform:uppercase}.h1{font-size:clamp(34px,5vw,58px);font-weight:800;line-height:1;margin:8px 0}.sub{color:var(--muted);max-width:740px;line-height:1.6}.grid{display:grid;grid-template-columns:390px 1fr;gap:18px;margin-top:24px}.panel{background:#0e1a29dd;border:1px solid var(--line);border-radius:22px;padding:20px}.field{margin-bottom:12px}.lab{display:block;font-size:11px;font-weight:800;color:#a9bdd5;margin-bottom:6px}.inp{width:100%;padding:11px 12px;background:#091321;border:1px solid #2b4160;color:white;border-radius:11px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:12px;padding:12px 15px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#63a8ff,#7c78ff);color:white}.btn.alt{background:#17263b;border:1px solid #304762}.previewWrap{background:#f3f6fa;border-radius:18px;padding:28px;min-height:390px;color:#152238}.sig{background:#fff;border:1px solid #dce4ee;border-radius:14px;padding:22px;max-width:660px;box-shadow:0 15px 40px #13233a18}.name{font-size:22px;font-weight:900}.role{color:#6f7d91;margin-top:3px}.rule{height:1px;background:#dfe6ef;margin:14px 0}.links{display:flex;gap:12px;flex-wrap:wrap;font-size:12px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}@media(max-width:860px){.grid{grid-template-columns:1fr}}
</style></head><body><main><div class="eyebrow">Signature Studio</div><div class="h1">Make every email look intentional.</div><div class="sub">Build a professional HTML signature you can paste into Gmail, Outlook or Apple Mail.</div><div class="grid"><section class="panel">
<div class="row"><div class="field"><label class="lab">Name</label><input class="inp" id="name" value="Alex Morgan"></div><div class="field"><label class="lab">Role</label><input class="inp" id="role" value="Product Designer"></div></div>
<div class="field"><label class="lab">Company</label><input class="inp" id="company" value="North Studio"></div>
<div class="row"><div class="field"><label class="lab">Email</label><input class="inp" id="email" value="alex@north.studio"></div><div class="field"><label class="lab">Phone</label><input class="inp" id="phone" value="+1 555 0100"></div></div>
<div class="row"><div class="field"><label class="lab">Website</label><input class="inp" id="web" value="https://north.studio"></div><div class="field"><label class="lab">LinkedIn</label><input class="inp" id="linkedin" value="https://linkedin.com/in/alex"></div></div>
<div class="field"><label class="lab">Accent</label><input class="inp" id="accent" type="color" value="#3b82f6"></div>
<div class="actions"><button class="btn" id="copy">Copy HTML</button><button class="btn alt" id="download">Download HTML</button></div>
</section><section class="previewWrap"><div id="preview" class="sig"></div></section></div></main>
<script>
const $=x=>document.getElementById(x);const fields=['name','role','company','email','phone','web','linkedin','accent'];function esc(v){return v.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function build(){let v=Object.fromEntries(fields.map(id=>[id,$(id).value]));let html='<div style="font-family:Arial,sans-serif;color:#132238;max-width:620px"><div style="font-size:22px;font-weight:700">'+esc(v.name)+'</div><div style="margin-top:3px;color:#718096">'+esc(v.role)+' · '+esc(v.company)+'</div><div style="height:1px;background:#e1e7ef;margin:14px 0"></div><div style="font-size:13px;line-height:1.7"><a href="mailto:'+esc(v.email)+'" style="color:'+v.accent+';text-decoration:none">'+esc(v.email)+'</a> · '+esc(v.phone)+'</div><div style="font-size:13px;margin-top:4px"><a href="'+esc(v.web)+'" style="color:'+v.accent+';text-decoration:none">'+esc(v.web.replace(/^https?:\/\//,''))+'</a> · <a href="'+esc(v.linkedin)+'" style="color:'+v.accent+';text-decoration:none">LinkedIn</a></div></div>';$('preview').innerHTML=html;return html}fields.forEach(id=>$(id).oninput=build);$('copy').onclick=async()=>{await navigator.clipboard.writeText(build());$('copy').textContent='Copied';setTimeout(()=>$('copy').textContent='Copy HTML',1200)};$('download').onclick=()=>{let html=build(),blob=new Blob([html],{type:'text/html'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='email-signature.html';a.click()};build();
</script></body></html>
