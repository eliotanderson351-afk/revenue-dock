<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuickInvoice</title><style>
:root{--bg:#070d17;--paper:#fff;--ink:#142033;--muted:#6f7d91;--line:#d9e1eb;--accent:#4b87ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#1a2d4b,#070d17 48%);font-family:Inter,system-ui,sans-serif;color:#edf4ff}main{max-width:1120px;margin:auto;padding:38px 20px 70px}.head{display:flex;justify-content:space-between;gap:20px;align-items:end}.eyebrow{font-size:12px;letter-spacing:.14em;color:#8dbbff;text-transform:uppercase}.h1{font-size:clamp(34px,5vw,58px);font-weight:800;line-height:1;margin:7px 0}.sub{color:#9db0c8;line-height:1.6}.grid{display:grid;grid-template-columns:390px 1fr;gap:20px;margin-top:22px}.panel{background:#0f1928e6;border:1px solid #233652;border-radius:22px;padding:20px}.field{margin-bottom:12px}.lab{display:block;font-size:11px;font-weight:800;color:#a9bdd7;margin-bottom:6px}.inp{width:100%;padding:11px 12px;border-radius:11px;border:1px solid #2b4162;background:#091321;color:white}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.items{display:grid;gap:8px}.line{display:grid;grid-template-columns:1fr 90px 120px 34px;gap:7px}.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#62a6ff,#7f77ff);color:white}.btn.ghost{background:#15243a;border:1px solid #304664}.invoice{background:white;color:#132033;border-radius:18px;padding:34px;min-height:700px;box-shadow:0 30px 80px #0006}.invtop{display:flex;justify-content:space-between;gap:20px}.brand{font-size:26px;font-weight:900}.muted{color:#7b8798}.table{width:100%;border-collapse:collapse;margin-top:28px}.table th,.table td{padding:11px 8px;border-bottom:1px solid #e3e8ef;text-align:left}.totals{margin-left:auto;max-width:300px;margin-top:20px}.tot{display:flex;justify-content:space-between;padding:8px 0}.grand{font-size:22px;font-weight:900;border-top:2px solid #17243a;margin-top:5px;padding-top:12px}.actions{display:flex;gap:10px;margin-top:12px}@media(max-width:900px){.grid{grid-template-columns:1fr}.invoice{min-height:auto}}@media print{body{background:white;color:black}.head,.panel:first-child{display:none}.grid{display:block}.invoice{box-shadow:none;border-radius:0}.actions{display:none}}
</style></head><body><main><div class="head"><div><div class="eyebrow">QuickInvoice</div><div class="h1">Invoice without the admin work.</div><div class="sub">Create a clean invoice in under a minute. Drafts stay on this device.</div></div></div><div class="grid"><section class="panel">
<div class="row"><div class="field"><label class="lab">Your business</label><input class="inp" id="biz" value="North Studio"></div><div class="field"><label class="lab">Invoice #</label><input class="inp" id="num" value="INV-001"></div></div>
<div class="row"><div class="field"><label class="lab">Customer</label><input class="inp" id="customer" value="Acme Co."></div><div class="field"><label class="lab">Date</label><input class="inp" id="date" type="date"></div></div>
<div class="field"><label class="lab">Line items</label><div class="items" id="items"></div></div><button class="btn ghost" id="add">+ Add item</button>
<div class="row" style="margin-top:14px"><div class="field"><label class="lab">Tax %</label><input class="inp" id="tax" type="number" value="0"></div><div class="field"><label class="lab">Discount</label><input class="inp" id="disc" type="number" value="0"></div></div>
<div class="actions"><button class="btn" onclick="window.print()">Print / PDF</button><button class="btn ghost" id="save">Save draft</button></div></section>
<section class="invoice" id="paper"><div class="invtop"><div><div class="brand" id="pbiz">North Studio</div><div class="muted" id="pcust">Invoice for Acme Co.</div></div><div style="text-align:right"><div class="muted">Invoice</div><strong id="pnum">INV-001</strong><div class="muted" id="pdate"></div></div></div><table class="table"><thead><tr><th>Description</th><th>Qty</th><th>Price</th><th>Total</th></tr></thead><tbody id="ptable"></tbody></table><div class="totals"><div class="tot"><span>Subtotal</span><span id="sub">$0.00</span></div><div class="tot"><span>Tax</span><span id="ptax">$0.00</span></div><div class="tot"><span>Discount</span><span id="pdisc">$0.00</span></div><div class="tot grand"><span>Total</span><span id="grand">$0.00</span></div></div></section></div></main>
<script>
const $=id=>document.getElementById(id);function addItem(v={name:'Website design',qty:1,price:500}){let d=document.createElement('div');d.className='line';d.innerHTML='<input class="inp name" value="'+v.name+'"><input class="inp qty" type="number" min="1" value="'+v.qty+'"><input class="inp price" type="number" min="0" step=".01" value="'+v.price+'"><button class="btn ghost del">×</button>';d.querySelectorAll('input').forEach(x=>x.oninput=render);d.querySelector('.del').onclick=()=>{d.remove();render()};$('items').appendChild(d);render()}function money(n){return '$'+n.toFixed(2)}function render(){let rows=[...document.querySelectorAll('#items .line')],sub=0;$('ptable').innerHTML=rows.map(r=>{let name=r.querySelector('.name').value,qty=+r.querySelector('.qty').value||0,p=+r.querySelector('.price').value||0,t=qty*p;sub+=t;return '<tr><td>'+name+'</td><td>'+qty+'</td><td>'+money(p)+'</td><td>'+money(t)+'</td></tr>'}).join('');let tax=sub*(+$('tax').value||0)/100,disc=+$('disc').value||0,total=sub+tax-disc;$('sub').textContent=money(sub);$('ptax').textContent=money(tax);$('pdisc').textContent='-'+money(disc);$('grand').textContent=money(total);['biz','customer','num','date'].forEach(id=>{let p={biz:'pbiz',customer:'pcust',num:'pnum'}[id];if(p) $(p).textContent=$(id).value});$('pcust').textContent='Invoice for '+$('customer').value;$('pdate').textContent=$('date').value||new Date().toLocaleDateString();localStorage.quickInvoice=JSON.stringify({biz:$('biz').value,customer:$('customer').value,num:$('num').value,date:$('date').value,tax:$('tax').value,disc:$('disc').value,items:rows.map(r=>({name:r.querySelector('.name').value,qty:r.querySelector('.qty').value,price:r.querySelector('.price').value}))})}
$('add').onclick=()=>addItem();['biz','customer','num','date','tax','disc'].forEach(id=>$(id).oninput=render);$('save').onclick=()=>{render();$('save').textContent='Saved';setTimeout(()=>$('save').textContent='Save draft',1000)};let d=new Date();$('date').value=d.toISOString().slice(0,10);let saved=JSON.parse(localStorage.quickInvoice||'null');if(saved){['biz','customer','num','date','tax','disc'].forEach(id=>{if(saved[id]!=null)$(id).value=saved[id]});(saved.items||[]).forEach(addItem)}else addItem();render();
</script></body></html>
