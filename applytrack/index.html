<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ApplyTrack</title><style>
:root{--bg:#07101b;--panel:#0e1928;--line:#243653;--text:#eef5ff;--muted:#9eb0c7;--a:#67a8ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#17304f,#07101b 48%);color:var(--text);font-family:Inter,system-ui,sans-serif}main{max-width:1240px;margin:auto;padding:36px 18px 60px}.top{display:flex;justify-content:space-between;gap:14px;align-items:end}.eyebrow{font-size:12px;color:#8fbeff;letter-spacing:.15em;text-transform:uppercase}.h1{font-size:clamp(34px,5vw,56px);font-weight:800;line-height:1;margin:8px 0}.sub{color:var(--muted);max-width:700px;line-height:1.55}.btn{border:0;border-radius:12px;padding:12px 15px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#62a8ff,#7c77ff);color:#fff}.toolbar{margin:22px 0;display:flex;gap:10px;flex-wrap:wrap}.inp{background:#091321;border:1px solid #2a3f5e;border-radius:11px;color:var(--text);padding:11px 12px}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.col{background:#0c1624aa;border:1px solid var(--line);border-radius:18px;padding:12px;min-height:420px}.chead{display:flex;justify-content:space-between;align-items:center;padding:4px 5px 12px;color:#a8bed8}.count{background:#182b45;border-radius:999px;padding:4px 8px;font-size:11px}.job{background:#111f31;border:1px solid #263b58;border-radius:14px;padding:13px;margin-bottom:10px;cursor:pointer}.job b{display:block;margin-bottom:4px}.meta{font-size:12px;color:var(--muted);line-height:1.5}.pill{display:inline-block;margin-top:8px;padding:5px 8px;background:#173252;border-radius:999px;font-size:10px}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:18px}.dialog{width:min(560px,100%);background:#0f1c2d;border:1px solid #2b4161;border-radius:20px;padding:20px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.full{width:100%;margin-bottom:10px}.actions{display:flex;gap:10px}@media(max-width:960px){.board{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.top{align-items:start;flex-direction:column}.board{grid-template-columns:1fr}}
</style></head><body><main><div class="top"><div><div class="eyebrow">ApplyTrack</div><div class="h1">Turn job hunting into a pipeline.</div><div class="sub">Track applications, interviews and follow-ups in one calm dashboard. Your data stays in your browser.</div></div><button class="btn" id="new">+ Add application</button></div><div class="toolbar"><input class="inp" id="search" placeholder="Search company or role"><select class="inp" id="filter"><option value="">All</option><option>remote</option><option>onsite</option><option>hybrid</option></select></div><div class="board" id="board"></div></main>
<div class="modal" id="modal"><div class="dialog"><h2 style="margin-top:0">Add application</h2><div class="row"><input class="inp" id="company" placeholder="Company"><input class="inp" id="role" placeholder="Role"></div><div class="row"><input class="inp" id="mode" placeholder="remote / hybrid / onsite"><input class="inp" id="follow" type="date"></div><textarea class="inp full" id="note" rows="4" placeholder="Notes / contact / next step"></textarea><div class="actions"><button class="btn" id="create">Save</button><button class="btn" style="background:#17263c;border:1px solid #304764" id="close">Cancel</button></div></div></div>
<script>
const stages=['Saved','Applied','Interview','Offer'];const $=x=>document.getElementById(x);let data=JSON.parse(localStorage.applyTrack||'[]');function save(){localStorage.applyTrack=JSON.stringify(data)}function render(){let q=$('search').value.toLowerCase(),f=$('filter').value;$('board').innerHTML=stages.map((s,si)=>{let jobs=data.filter(x=>x.stage===s&&(!q||(x.company+' '+x.role).toLowerCase().includes(q))&&(!f||x.mode===f));return '<section class="col"><div class="chead"><b>'+s+'</b><span class="count">'+jobs.length+'</span></div>'+jobs.map(x=>'<div class="job" data-id="'+x.id+'"><b>'+x.company+'</b><div>'+x.role+'</div><div class="meta">'+(x.mode||'')+(x.follow?' · follow-up '+x.follow:'')+'</div><span class="pill">Click to advance</span></div>').join('')+'</section>'}).join('');document.querySelectorAll('.job').forEach(el=>el.onclick=()=>{let i=data.findIndex(x=>x.id===el.dataset.id);data[i].stage=stages[Math.min(stages.length-1,stages.indexOf(data[i].stage)+1)];save();render()})}
$('new').onclick=()=>{$('modal').style.display='flex'};$('close').onclick=()=>{$('modal').style.display='none'};$('create').onclick=()=>{if(!$('company').value||!$('role').value)return;data.push({id:Date.now().toString(),company:$('company').value,role:$('role').value,mode:$('mode').value,follow:$('follow').value,note:$('note').value,stage:'Saved'});save();render();$('modal').style.display='none';['company','role','mode','follow','note'].forEach(id=>$(id).value='')};$('search').oninput=render;$('filter').onchange=render;render();
</script></body></html>
