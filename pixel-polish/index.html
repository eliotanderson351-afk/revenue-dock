<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixel Polish — Image Optimizer</title><style>
:root{--bg:#08101c;--panel:#101c2d;--line:#243650;--text:#eef5ff;--muted:#9cb0c9;--accent:#6baeff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#17345a,#08101c 42%,#050912);color:var(--text);font-family:Inter,system-ui,sans-serif}main{max-width:1080px;margin:auto;padding:42px 20px 70px}.eyebrow{color:#8fc0ff;font-size:12px;letter-spacing:.15em;text-transform:uppercase}.h1{font-size:clamp(34px,5vw,60px);line-height:1;margin:9px 0}.sub{color:var(--muted);line-height:1.6;max-width:720px}.drop{margin-top:24px;border:1.5px dashed #40638e;border-radius:24px;padding:38px;text-align:center;background:#0d1827aa}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#63a8ff,#7d75ff);color:white}.toolbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.control{margin-top:20px;background:#0b1524;border:1px solid var(--line);border-radius:14px;padding:12px;color:var(--text)}.list{margin-top:20px;display:grid;gap:12px}.item{display:grid;grid-template-columns:110px 1fr auto;gap:14px;align-items:center;background:#101b2b;border:1px solid var(--line);border-radius:16px;padding:12px}.thumb{width:110px;height:80px;object-fit:cover;border-radius:10px;background:#0a1220}.meta{color:var(--muted);font-size:12px;line-height:1.6}.badge{display:inline-block;padding:6px 9px;border-radius:999px;background:#173154;color:#beddff;font-size:11px;font-weight:700}.empty{color:var(--muted);text-align:center;padding:25px}@media(max-width:700px){.item{grid-template-columns:80px 1fr}.thumb{width:80px;height:64px}.item button{grid-column:1/-1}}
</style></head><body><main><div class="eyebrow">Pixel Polish</div><div class="h1">Make heavy images lighter.</div><div class="sub">Compress common website images without uploading them anywhere. Useful for landing pages, shops, blogs and CMS content.</div>
<div class="drop" id="drop"><div style="font-size:26px;font-weight:800">Drop images here</div><div class="sub" style="margin:8px auto 18px">JPG, PNG, WebP — processed locally in your browser.</div><div class="toolbar"><label class="btn">Choose images<input id="files" type="file" accept="image/*" multiple hidden></label><select class="control" id="format"><option value="webp">WebP</option><option value="jpeg">JPEG</option></select><label class="control">Quality <input id="quality" type="range" min="40" max="95" value="82"></label><label class="control">Max width <input id="maxw" type="number" min="320" step="10" value="1600" style="width:80px;background:none;border:0;color:inherit"></label></div></div>
<div class="list" id="list"><div class="empty">No images yet.</div></div></main>
<script>
const drop=$('drop');function $(x){return document.getElementById(x)};let jobs=[];function fmt(n){if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KB';return (n/1048576).toFixed(2)+' MB'}function render(){if(!jobs.length){$('list').innerHTML='<div class="empty">No images yet.</div>';return}$('list').innerHTML=jobs.map((j,i)=>'<div class="item"><img class="thumb" src="'+j.preview+'"><div><div style="font-weight:800">'+j.file.name+'</div><div class="meta">'+fmt(j.file.size)+' → '+fmt(j.out.size)+' · '+Math.max(0,100-Math.round(j.out.size/j.file.size*100))+'% smaller</div><span class="badge">'+j.out.type.split('/')[1].toUpperCase()+'</span></div><button class="btn" onclick="download('+i+')">Download</button></div>').join('')}
async function addFiles(fs){for(const file of fs){if(!file.type.startsWith('image/'))continue;const img=new Image();img.src=URL.createObjectURL(file);await img.decode();let scale=Math.min(1,Number($('maxw').value||1600)/img.width),w=Math.round(img.width*scale),h=Math.round(img.height*scale),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);let mime='image/'+$('format').value,blob=await new Promise(r=>c.toBlob(r,mime,Number($('quality').value)/100));jobs.push({file,preview:URL.createObjectURL(blob),out:{blob,size:blob.size,type:mime},name:file.name});URL.revokeObjectURL(img.src)}render()}
$('files').onchange=e=>addFiles(e.target.files);drop.ondragover=e=>{e.preventDefault();drop.style.borderColor='#6baeff'};drop.ondrop=e=>{e.preventDefault();addFiles(e.dataTransfer.files)};['format','quality','maxw'].forEach(id=>$(id).addEventListener('change',()=>{if(jobs.length){let fs=jobs.map(j=>j.file);jobs=[];addFiles(fs)}}));window.download=i=>{let a=document.createElement('a');a.href=jobs[i].preview;a.download=jobs[i].file.name.replace(/\.[^.]+$/,'')+'-optimized.'+jobs[i].out.type.split('/')[1];a.click()}
</script></body></html>
